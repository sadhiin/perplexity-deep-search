<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar for chat history -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Chat History</h2>
                <button id="new-chat-btn" class="new-chat-btn">
                    <span>+</span> New Chat
                </button>
            </div>
            <div class="chat-search">
                <input
                    type="text"
                    id="chat-search"
                    placeholder="Search chats..."
                    aria-label="Search conversations"
                />
            </div>
            <div id="chat-list" class="chat-list">
                <!-- Chat history items will appear here -->
            </div>
            <div class="bookmark-panel">
                <div class="bookmark-panel-header">
                    <h3>Bookmarks</h3>
                    <span id="bookmark-count" class="bookmark-count">0</span>
                </div>
                <div id="bookmark-list" class="bookmark-list">
                    <p class="bookmark-empty">No bookmarks yet.</p>
                </div>
            </div>
        </aside>

        <!-- Main chat area -->
        <main class="main-chat">
            <div class="chat-header">
                <h1>AI Assistant</h1>
                <div class="chat-controls">
                    <button id="theme-toggle" class="theme-toggle" title="Toggle Dark Mode">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                    <button id="menu-toggle" class="menu-toggle">☰</button>
                </div>
            </div>

            <section id="chat-summary" class="chat-summary" hidden>
                <div class="chat-summary-header">
                    <div>
                        <h2>Conversation Summary</h2>
                        <p class="chat-summary-meta" id="chat-summary-meta"></p>
                    </div>
                    <button id="summary-refresh-btn" class="summary-refresh-btn" type="button">
                        Refresh Summary
                    </button>
                </div>
                <p id="chat-summary-content" class="chat-summary-content"></p>
                <div class="chat-tags">
                    <div class="chat-tags-header">
                        <span>Tags</span>
                    </div>
                    <div id="chat-tags-list" class="chat-tags-list"></div>
                    <input
                        type="text"
                        id="chat-tag-input"
                        class="chat-tag-input"
                        placeholder="Add tag and press Enter"
                        aria-label="Add chat tag"
                    />
                </div>
            </section>

            <div id="messages-container" class="messages-container">
                <div class="welcome-message">
                    <div class="welcome-content">
                        <h2>Welcome to AI Chat</h2>
                        <p>Ask me anything! I'm here to help you with information, analysis, and conversation.</p>
                    </div>
                </div>
            </div>

            <div class="input-container">
                <form id="message-form" class="message-form">
                    <div class="input-wrapper">
                        <textarea
                            id="message-input"
                            placeholder="Type your message here..."
                            rows="1"
                            maxlength="2000"
                        ></textarea>
                        <button type="submit" id="send-btn" class="send-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13"/>
                            </svg>
                        </button>
                    </div>
                </form>
                <div class="input-footer">
                    <span class="char-count">0/2000</span>
                </div>
            </div>
        </main>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
